<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3482d"><title>NOVA Market — Ofertas para você</title><style>
:root{--red:#f3482d;--deep:#e93d26;--bg:#f3f3f3;--ink:#252525}*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}header{background:var(--red);position:sticky;top:0;z-index:5;padding:13px 14px 16px}.head{max-width:1150px;margin:auto;display:flex;align-items:center;gap:12px}.searchbox{background:white;border-radius:4px;display:flex;align-items:center;flex:1;min-width:0;padding:0 11px}.searchbox svg{flex:none;color:#929292}.searchbox input{border:0;outline:0;width:100%;min-width:0;padding:13px 9px;font-size:15px;color:#333}.headbtn{border:0;background:none;color:white;position:relative;padding:4px}.headbtn svg{width:28px;height:28px;stroke-width:1.8}.count{position:absolute;top:-4px;right:-6px;background:#fff;color:var(--red);border-radius:12px;padding:1px 5px;font-size:10px}.wrap{max-width:1150px;margin:auto}.hero{background:linear-gradient(125deg,#ef321c,#ff6243 75%,#f7462e);color:white;min-height:210px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:25px 24px;overflow:hidden}.hero h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px;font-weight:900;line-height:1}.hero p{font-size:15px;margin:0 0 13px}.hero strong{background:#fff;color:#f3452c;padding:7px 10px;display:inline-block;border-radius:3px;font-size:14px}.hero .illustration{font-size:clamp(70px,17vw,145px);filter:drop-shadow(0 12px 12px #8c1a1a55);white-space:nowrap}.dots{text-align:center;background:#f3452c;padding:0 0 10px;color:#ffd7cf;font-size:14px;letter-spacing:8px}.shortcuts{background:white;display:flex;overflow-x:auto;gap:5px;padding:19px 8px 15px;scrollbar-width:none}.shortcut{flex:0 0 88px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:none;border:0;color:#222;font-size:12px;line-height:1.25}.shortcut .tile{width:55px;height:55px;border:1px solid #e9e9e9;border-radius:15px;display:grid;place-items:center;background:#fff;font-size:26px;box-shadow:0 1px 3px #00000008}.shortcut.selected .tile{border-color:var(--red);background:#fff3ef}.promo{background:white;padding:17px 12px 19px;margin-bottom:9px}.promo-inner{background:linear-gradient(110deg,#ff4a30,#fa4d35);color:white;border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:space-between;padding:17px 22px;overflow:hidden}.promo h2{margin:0 0 10px;font-size:clamp(18px,3.8vw,28px)}.promo b{display:inline-block;background:white;color:#e74530;padding:7px 11px;border-radius:5px;font-size:13px}.promo .pic{font-size:clamp(52px,12vw,100px)}.sectionbar{padding:14px 13px 11px;background:white;display:flex;align-items:center;justify-content:space-between}.sectionbar h2{font-size:17px;margin:0;color:#e74730}.sectionbar button{border:0;background:none;color:#777;font-size:13px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px}.product{background:white;min-width:0;overflow:hidden;border-radius:4px;display:flex;flex-direction:column}.photo{position:relative;background:#f8f8f8}.photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.discount{position:absolute;right:0;top:0;background:#fff0eb;color:#e94c32;font-weight:700;font-size:13px;padding:5px}.detail{padding:10px;display:flex;flex:1;flex-direction:column}.name{font-size:14px;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 8px}.store{font-size:11px;color:#777;margin-bottom:8px}.price{color:#ed4c35;font-size:21px;font-weight:500;margin-top:auto}.price small{font-size:11px}.sold{font-size:12px;color:#777;margin-top:7px}.add{background:#fff;border:1px solid #f14c35;color:#e84932;padding:9px 6px;border-radius:4px;margin-top:10px;font-size:12px;font-weight:bold}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;border-top:1px solid #e9e9e9;z-index:6;padding:8px 0 max(8px,env(safe-area-inset-bottom))}.bottom button{background:none;border:0;display:flex;align-items:center;flex-direction:column;gap:5px;color:#777;font-size:11px;min-width:60px}.bottom button svg{width:25px;height:25px;stroke-width:1.7}.bottom button.active{color:var(--red)}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10;justify-content:flex-end}.overlay.open{display:flex}.drawer{background:white;width:min(440px,100%);height:100%;overflow-y:auto;padding:20px}.drawerhead{display:flex;align-items:center;justify-content:space-between}.drawerhead h2{font-size:20px}.close{background:#eee;color:#333;border:0;border-radius:7px;padding:9px 13px}.field{display:block;font-size:13px;font-weight:bold;margin:14px 0}.field input,.field select{display:block;margin-top:6px;width:100%;padding:12px;border:1px solid #ddd;border-radius:5px}.primary{background:var(--red);border:0;border-radius:5px;color:white;padding:12px 17px;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.row button{background:#f4f4f4;border:0;border-radius:5px;padding:7px 9px}.muted{color:#777;font-size:12px;line-height:1.5}.empty{text-align:center;color:#888;padding:30px}.desktopbrand{display:none}footer{font-size:12px;color:#888;text-align:center;padding:25px 15px 105px}@media(min-width:900px){.desktopbrand{display:block;font-size:23px;font-weight:900;color:white;white-space:nowrap}.hero{border-radius:0 0 12px 12px}.products{gap:14px}.product{border-radius:8px}.bottom{max-width:1150px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0}}@media(max-width:600px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.detail{padding:9px}.hero{min-height:170px;padding:20px 13px}.hero p{font-size:12px}.hero strong{font-size:11px}.promo-inner{min-height:105px;padding:15px}.shortcut{flex-basis:83px}.price{font-size:19px}.name{font-size:13px}.head{gap:11px}}
</style></head><body><header><div class="head"><div class="desktopbrand">NOVA Market</div><div class="searchbox"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="Buscar no NOVA Market" aria-label="Buscar produtos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg></div><button class="headbtn" aria-label="Carrinho" onclick="cartPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h3l2.5 12h12l2.5-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/></svg><span class="count" id="count">0</span></button><button class="headbtn" aria-label="Minha loja" onclick="sellerPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11a8 8 0 0 1-8 8H5l-3 3v-7a8 8 0 1 1 19-4Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></button></div></header><main class="wrap"><section class="hero"><div><h1>OFERTAS<br>ESPECIAIS</h1><p>Descontos para aproveitar hoje</p><strong>PREÇOS QUE SURPREENDEM</strong></div><div class="illustration" aria-hidden="true">🛍️📱</div></section><div class="dots">● ● ● ● ●</div><div class="shortcuts" id="shortcuts"></div><section class="promo"><div class="promo-inner"><div><h2>Mais vendidos<br>do NOVA Market</h2><b>Ofertas selecionadas</b></div><div class="pic" aria-hidden="true">🎧⌚</div></div></section><div class="sectionbar"><h2 id="heading">DESCOBERTAS DO DIA</h2><button onclick="choose('')">Ver tudo ›</button></div><div class="products" id="products"></div></main><footer>NOVA Market · Marketplace demonstrativo · Sem pagamentos reais</footer><nav class="bottom"><button class="active" onclick="home()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/></svg>Início</button><button onclick="choose('')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16v16H4zM4 10h16M9 10v11"/></svg>Categorias</button><button onclick="choose('Eletrônicos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Ofertas</button><button onclick="ordersPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 5h14v16H5zM8 2v6M16 2v6M8 12h8M8 16h5"/></svg>Pedidos</button><button onclick="sellerPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-5 3-8 8-8s8 3 8 8"/></svg>Eu</button></nav><div class="overlay" id="overlay" onclick="if(event.target===this)closePanel()"><div class="drawer"><div class="drawerhead"><h2 id="paneltitle"></h2><button class="close" onclick="closePanel()">✕</button></div><div id="panelbody"></div></div></div><script>
const demo=[{id:1,name:'Smartphone 128 GB com câmera avançada',price:1299,cat:'Celulares',store:'Tech Nova',stock:10,img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=550&fit=crop'},{id:2,name:'Armário organizador multiuso de madeira',price:289.9,cat:'Casa',store:'Casa & Estilo',stock:12,img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=550&fit=crop'},{id:3,name:'Fone de ouvido Bluetooth premium',price:129.9,cat:'Eletrônicos',store:'Tech Nova',stock:20,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=550&fit=crop'},{id:4,name:'Relógio inteligente smartwatch',price:349.9,cat:'Eletrônicos',store:'Prime Shop',stock:8,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=550&fit=crop'},{id:5,name:'Notebook ultrafino para trabalho e estudos',price:2499,cat:'Informática',store:'Prime Shop',stock:5,img:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=550&fit=crop'},{id:6,name:'Controle para videogame sem fio',price:199.9,cat:'Games',store:'Game Center',stock:9,img:'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=550&fit=crop'},{id:7,name:'Smart TV 4K tela grande',price:1899,cat:'TV e Vídeo',store:'Prime Shop',stock:4,img:'https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=550&fit=crop'},{id:8,name:'Cadeira moderna para sua casa',price:249,cat:'Casa',store:'Casa & Estilo',stock:16,img:'https://images.unsplash.com/photo-1503602642458-232111445657?w=550&fit=crop'}];
const categories=[['Todos','🏠'],['Cupons','🎟️'],['Eletrônicos','🎧'],['Celulares','📱'],['Casa','🛋️'],['Informática','💻'],['Games','🎮'],['TV e Vídeo','📺']];const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let store=read('nm4_store',null),mine=read('nm4_mine',[]),cart=read('nm4_cart',{}),orders=read('nm4_orders',[]),category='';const products=()=>[...mine,...demo],fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function save(){localStorage.setItem('nm4_store',JSON.stringify(store));localStorage.setItem('nm4_mine',JSON.stringify(mine));localStorage.setItem('nm4_cart',JSON.stringify(cart));localStorage.setItem('nm4_orders',JSON.stringify(orders));document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}function render(){let q=document.getElementById('search').value.toLowerCase().trim();let list=products().filter(p=>(!category||p.cat===category)&&(!q||(p.name+' '+p.store+' '+p.cat).toLowerCase().includes(q)));document.getElementById('heading').textContent=q?'RESULTADOS DA BUSCA':category?category.toUpperCase():'DESCOBERTAS DO DIA';document.getElementById('shortcuts').innerHTML=categories.map(([c,icon])=>'<button class="shortcut '+((category||'Todos')===c?'selected':'')+'" onclick="choose(\''+(c==='Todos'||c==='Cupons'?'':c)+'\')"><span class="tile">'+icon+'</span>'+c+'</button>').join('');document.getElementById('products').innerHTML=list.map((p,i)=>'<article class="product"><div class="photo"><img loading="lazy" src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><span class="discount">OFERTA</span></div><div class="detail"><p class="name">'+esc(p.name)+'</p><div class="store">'+esc(p.store)+'</div><div class="price">'+fmt(p.price)+' <small>no app</small></div><div class="sold">Estoque: '+p.stock+'</div><button class="add" onclick="add('+p.id+')">Adicionar ao carrinho</button></div></article>').join('')||'<p class="empty">Nenhum produto encontrado.</p>';save()}function choose(c){category=c;render();document.getElementById('heading').scrollIntoView({behavior:'smooth',block:'start'})}function home(){category='';document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}function add(id){let p=products().find(x=>x.id===id);if(!p||cart[id]>=p.stock)return alert('Estoque indisponível');cart[id]=(cart[id]||0)+1;save();alert('Produto adicionado ao carrinho')}function panel(t,b){document.getElementById('paneltitle').textContent=t;document.getElementById('panelbody').innerHTML=b;document.getElementById('overlay').classList.add('open')}function closePanel(){document.getElementById('overlay').classList.remove('open')}function cartPanel(){let list=products().filter(p=>cart[p.id]);panel('Meu carrinho',list.length?list.map(p=>'<div class="row"><div>'+esc(p.name)+'<br><strong>'+fmt(p.price)+'</strong></div><div><button onclick="qty('+p.id+',-1)">−</button> '+cart[p.id]+' <button onclick="qty('+p.id+',1)">+</button></div></div>').join('')+'<h3>Total: '+fmt(list.reduce((s,p)=>s+p.price*cart[p.id],0))+'</h3><button class="primary" onclick="checkout()">Simular pedido</button><p class="muted">Não há pagamentos reais.</p>':'<p class="empty">Seu carrinho está vazio.</p>')}function qty(id,n){let p=products().find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));if(!cart[id])delete cart[id];save();cartPanel()}function checkout(){let list=products().filter(p=>cart[p.id]);if(!list.length)return;orders.unshift({date:new Date().toLocaleString('pt-BR'),total:list.reduce((s,p)=>s+p.price*cart[p.id],0)});cart={};save();panel('Pedido simulado','<p>Pedido registrado apenas neste navegador.</p><p class="muted">Nenhuma compra real foi realizada.</p>')}function ordersPanel(){panel('Meus pedidos',orders.length?orders.map(o=>'<div class="row"><span>'+esc(o.date)+'</span><strong>'+fmt(o.total)+'</strong></div>').join(''):'<p class="empty">Nenhum pedido registrado.</p>')}function sellerPanel(){if(!store)return panel('Criar minha loja','<p class="muted">Cadastro demonstrativo salvo apenas neste navegador.</p><form onsubmit="createStore(event)"><label class="field">Nome da loja<input name="name" maxlength="60" required></label><label class="field">Cidade<input name="city" maxlength="60" required></label><button class="primary">Criar loja</button></form>');panel('Central do lojista','<h3>'+esc(store.name)+'</h3><p class="muted">'+esc(store.city)+'</p><button class="primary" onclick="productForm()">+ Cadastrar produto</button><h3>Meus anúncios</h3>'+mine.map(p=>'<div class="row"><div>'+esc(p.name)+'<br>'+fmt(p.price)+' · Estoque '+p.stock+'</div><button onclick="remove('+p.id+')">Excluir</button></div>').join('')+'<p class="muted">Produtos salvos apenas neste navegador. Para vendedores e compradores diferentes compartilharem anúncios, é necessário um backend.</p>')}function createStore(e){e.preventDefault();let f=new FormData(e.target);store={name:String(f.get('name')).trim(),city:String(f.get('city')).trim()};save();sellerPanel()}function productForm(){panel('Cadastrar produto','<form onsubmit="createProduct(event)"><label class="field">Nome<input name="name" maxlength="90" required></label><label class="field">Categoria<select name="cat">'+categories.slice(2).map(([c])=>'<option>'+c+'</option>').join('')+'</select></label><label class="field">Preço (R$)<input name="price" type="number" min="0.01" max="1000000" step="0.01" required></label><label class="field">Estoque<input name="stock" type="number" min="1" max="100000" step="1" required></label><label class="field">URL da foto (opcional)<input name="img" type="url"></label><button class="primary">Publicar anúncio</button></form>')}function createProduct(e){e.preventDefault();let f=new FormData(e.target),price=Number(f.get('price')),stock=Number(f.get('stock'));if(!(price>0&&Number.isInteger(stock)&&stock>0))return;let img=String(f.get('img')||'');if(!img.startsWith('https://'))img='https://placehold.co/300x300?text=Produto';mine.unshift({id:Date.now(),name:String(f.get('name')).trim(),cat:String(f.get('cat')),price,stock,img,store:store.name});save();render();sellerPanel()}function remove(id){if(!confirm('Excluir anúncio?'))return;mine=mine.filter(p=>p.id!==id);delete cart[id];save();render();sellerPanel()}document.getElementById('search').addEventListener('input',()=>{category='';render()});render();
</script></body></html>
