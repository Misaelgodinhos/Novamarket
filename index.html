async function refreshMarket(){if(!db)return;const {data,error}=await db.from('nm_products').select('id,name,category,price,stock,image_url,nm_stores(name)').eq('active',true).order('created_at',{ascending:false}).limit(100);if(error){console.error('Market read',error);return}remoteProducts=(data||[]).map(p=>({id:p.id,name:p.name,cat:p.category,price:Number(p.price),stock:p.stock,img:p.image_url||'https://placehold.co/500x500?text=Produto',store:p.nm_stores?.name||'Loja'}));remoteReady=true;render()}
async function refreshAuth(){if(!db)return;const {data}=await db.auth.getUser();sessionUser=data?.user||null;if(sessionUser){const r=await db.from('nm_stores').select('*').eq('owner_id',sessionUser.id).maybeSingle();remoteStore=r.data||null}else remoteStore=null}
async function authPanel(){panel('Entrar no NOVA Market','<p class="muted">Entre para criar uma loja e publicar produtos visíveis para todos.</p><form onsubmit="marketLogin(event)"><label class="field">E-mail<input name="email" type="email" required></label><label class="field">Senha<input name="password" type="password" minlength="6" required></label><button class="primary" name="action" value="login">Entrar</button> <button class="primary" name="action" value="signup">Criar conta</button></form>')}
async function marketLogin(e){e.preventDefault();const fd=new FormData(e.target),email=String(fd.get('email')),password=String(fd.get('password'));const action=e.submitter?.value||'login';const result=action==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(result.error)return alert(result.error.message);if(action==='signup'&&!result.data.session)return panel('Verifique seu e-mail','<p>Confirme o cadastro pelo link enviado ao seu e-mail e depois faça login.</p>');await refreshAuth();sellerPanel()}
sellerPanel=async function(){if(!db)return panel('Indisponível','<p>Não foi possível carregar a conexão com o banco. Atualize a página.</p>');await refreshAuth();if(!sessionUser)return authPanel();if(!remoteStore)return panel('Criar minha loja','<p class="muted">Sua loja ficará vinculada à sua conta.</p><form onsubmit="createStore(event)"><label class="field">Nome da loja<input name="name" maxlength="60" required></label><label class="field">Cidade<input name="city" maxlength="60" required></label><button class="primary">Criar loja</button></form><p><button class="close" onclick="marketLogout()">Sair da conta</button></p>');const {data}=await db.from('nm_products').select('id,name,price,stock').eq('store_id',remoteStore.id).order('created_at',{ascending:false});panel('Central do lojista','<h3>'+esc(remoteStore.name)+'</h3><p class="muted">'+esc(remoteStore.city)+'</p><button class="primary" onclick="productForm()">+ Cadastrar produto</button><h3>Meus anúncios</h3>'+(data||[]).map(p=>'<div class="row"><div>'+esc(p.name)+'<br>'+fmt(p.price)+' · Estoque '+p.stock+'</div><button onclick="remove(\''+p.id+'\')">Excluir</button></div>').join('')+'<p><button class="close" onclick="marketLogout()">Sair da conta</button></p>')};
createStore=async function(e){e.preventDefault();const fd=new FormData(e.target);const {error}=await db.from('nm_stores').insert({owner_id:sessionUser.id,name:String(fd.get('name')).trim(),city:String(fd.get('city')).trim()});if(error)return alert(error.message);await refreshAuth();sellerPanel()};
createProduct=async function(e){e.preventDefault();if(!remoteStore)return alert('Crie sua loja primeiro');const fd=new FormData(e.target),price=Number(fd.get('price')),stock=Number(fd.get('stock'));if(!(price>0&&Number.isInteger(stock)&&stock>0))return;const img=String(fd.get('img')||'');const {error}=await db.from('nm_products').insert({store_id:remoteStore.id,name:String(fd.get('name')).trim(),category:String(fd.get('cat')),price,stock,image_url:img.startsWith('https://')?img:null});if(error)return alert(error.message);await refreshMarket();sellerPanel()};
remove=async function(id){if(!confirm('Excluir anúncio?'))return;const {error}=await db.from('nm_products').delete().eq('id',id);if(error)return alert(error.message);await refreshMarket();sellerPanel()};
async function marketLogout(){await db.auth.signOut();sessionUser=null;remoteStore=null;authPanel()}
const oldAdd=add;
add=function(id){const p=products().find(x=>String(x.id)===String(id));if(!p)return;const current=cart[id]||0;if(current>=p.stock)return alert('Estoque indisponível');cart[id]=current+1;save();alert('Produto adicionado ao carrinho')};
const oldCheckout=checkout;
checkout=function(){panel('Pedidos ainda não disponíveis','<p>O catálogo de lojas e produtos está conectado ao Supabase. O processamento de pedidos e pagamentos ainda precisa de uma rotina segura no servidor.</p><p class="muted">Seu carrinho permanece salvo neste navegador.</p>')};
if(db){db.auth.onAuthStateChange(()=>{refreshAuth()});refreshAuth().then(refreshMarket)}else console.error('Supabase SDK não carregou');
</script></body></html>
