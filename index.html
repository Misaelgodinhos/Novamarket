<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Market</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;margin:0;background:#f6f8fb;color:#192d4b}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4e9f1;padding:16px;z-index:2}.top{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:23px;font-weight:900;color:#1854b8}.logo b{color:#e83c4d}input,select{font:inherit;border:1px solid #dce4ee;border-radius:10px;padding:12px;width:100%}#search{flex:1;min-width:180px}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:11px 14px;background:#1654b8;color:#fff;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{border-radius:18px;background:#1752b5;color:#fff;padding:32px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0;font-size:clamp(24px,5vw,40px)}.hero p{opacity:.85}.hero button{background:#ffcd3c;color:#1b2b47}.hero .emoji{font-size:70px}.seller{margin:20px 0;background:#fff;border:1px solid #e7ebf2;border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.seller p,.muted{color:#728199;font-size:13px}h2{font-size:20px;margin:24px 0 12px}.cats{display:flex;gap:8px;overflow:auto}.cats button{background:#fff;border:1px solid #e4e9f1;color:#324562;white-space:nowrap}.cats button.active{border-color:#1554b8;color:#1554b8;background:#eaf2ff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e8edf3;border-radius:16px;padding:12px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eef1f5}.card h3{font-size:14px;min-height:40px;margin:8px 0}.price{font-size:20px;font-weight:850}.card button{width:100%;font-size:12px;margin-top:9px}.drawerbg{display:none;position:fixed;inset:0;background:#0a1c3766;z-index:5;justify-content:flex-end}.drawerbg.open{display:flex}.drawer{background:#fff;width:min(450px,100%);height:100%;overflow:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.head button{background:#edf1f7;color:#24344d}.field{display:block;font-size:13px;font-weight:650;margin:14px 0}.field input,.field select{margin-top:6px}.row{padding:12px 0;border-bottom:1px solid #e7edf4;display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{background:#edf2f8;color:#244266}.notice{font-size:12px;color:#728199;line-height:1.5}footer{text-align:center;color:#7d8ca0;font-size:12px;padding:35px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.hero .emoji{font-size:42px}.seller{flex-direction:column;align-items:flex-start}.top #search{order:4;flex-basis:100%}}@media(max-width:380px){.grid{gap:8px}.card{padding:9px}.price{font-size:17px}}</style><header><div class="top"><div class="logo">NOVA<b>Market</b></div><input id="search" placeholder="O que você procura?" aria-label="Pesquisar produtos"><button onclick="cartPanel()">🛒 <span id="count">0</span></button><button onclick="sellerPanel()">Vender</button></div></header><main class="wrap"><section class="hero"><div><h1>Ofertas da semana</h1><p>Compre de diferentes lojas em um só lugar.</p><button onclick="all=true;render()">Ver ofertas</button></div><span class="emoji">🎧</span></section><section class="seller"><div><strong>Venda no NOVA Market</strong><p>Crie sua loja e anuncie produtos.</p></div><button onclick="sellerPanel()">Começar a vender</button></section><h2>Categorias</h2><div class="cats" id="cats"></div><h2 id="heading">Ofertas para você</h2><div class="grid" id="grid"></div></main><footer>NOVA Market · Demonstração local · Não realiza pagamentos reais</footer><div class="drawerbg" id="bg" onclick="if(event.target===this)closePanel()"><div class="drawer"><div class="head"><h2 id="title"></h2><button onclick="closePanel()">✕</button></div><div id="body"></div></div></div><script>
const demo=[{id:1,name:'Smartphone 128GB',price:1299,cat:'Celulares',store:'Tech Nova',stock:10,img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400'},{id:2,name:'Smartwatch Bluetooth',price:349.9,cat:'Eletrônicos',store:'Prime Shop',stock:8,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'},{id:3,name:'Fone sem fio',price:129.9,cat:'Eletrônicos',store:'Tech Nova',stock:20,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400'},{id:4,name:'Notebook ultrafino',price:2499,cat:'Informática',store:'Prime Shop',stock:5,img:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400'},{id:5,name:'Controle para games',price:199.9,cat:'Games',store:'Game Center',stock:9,img:'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=400'},{id:6,name:'Smart TV 4K',price:1899,cat:'TV e Vídeo',store:'Prime Shop',stock:4,img:'https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400'}];const categories=['Todos','Celulares','Eletrônicos','Informática','Games','TV e Vídeo','Casa'];const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let store=read('nm4_store',null),mine=read('nm4_mine',[]),cart=read('nm4_cart',{}),orders=read('nm4_orders',[]),category='',all=false;const products=()=>[...mine,...demo],fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function save(){localStorage.setItem('nm4_store',JSON.stringify(store));localStorage.setItem('nm4_mine',JSON.stringify(mine));localStorage.setItem('nm4_cart',JSON.stringify(cart));localStorage.setItem('nm4_orders',JSON.stringify(orders));document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}function render(){let q=document.getElementById('search').value.toLowerCase();let list=products().filter(p=>(!category||p.cat===category)&&(!q||(p.name+' '+p.store+' '+p.cat).toLowerCase().includes(q)));if(!all&&!q&&!category)list=list.slice(0,4);document.getElementById('heading').textContent=q?'Resultados':category||'Ofertas para você';document.getElementById('cats').innerHTML=categories.map(c=>'<button class="'+((category||'Todos')===c?'active':'')+'" onclick="choose(\''+(c==='Todos'?'':c)+'\')">'+c+'</button>').join('');document.getElementById('grid').innerHTML=list.map(p=>'<article class="card"><img loading="lazy" src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><div class="muted">Vendido por '+esc(p.store)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+fmt(p.price)+'</div><div class="muted">Entrega a combinar</div><button onclick="add('+p.id+')">Adicionar ao carrinho</button></article>').join('')||'<p>Nenhum produto encontrado.</p>';save()}function choose(c){category=c;all=true;render()}function add(id){let p=products().find(x=>x.id===id);if(!p||cart[id]>=p.stock)return alert('Estoque indisponível');cart[id]=(cart[id]||0)+1;save();alert('Adicionado ao carrinho')}function panel(t,b){document.getElementById('title').textContent=t;document.getElementById('body').innerHTML=b;document.getElementById('bg').classList.add('open')}function closePanel(){document.getElementById('bg').classList.remove('open')}function cartPanel(){let list=products().filter(p=>cart[p.id]);panel('Meu carrinho',list.length?list.map(p=>'<div class="row"><div>'+esc(p.name)+'<br><strong>'+fmt(p.price)+'</strong></div><div><button onclick="qty('+p.id+',-1)">−</button> '+cart[p.id]+' <button onclick="qty('+p.id+',1)">+</button></div></div>').join('')+'<h3>Total: '+fmt(list.reduce((s,p)=>s+p.price*cart[p.id],0))+'</h3><button onclick="checkout()">Simular pedido</button><p class="notice">Sem pagamentos reais.</p>':'<p>Seu carrinho está vazio.</p>')}function qty(id,n){let p=products().find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));if(!cart[id])delete cart[id];save();cartPanel()}function checkout(){let list=products().filter(p=>cart[p.id]);if(!list.length)return;orders.unshift({date:new Date().toLocaleString('pt-BR'),total:list.reduce((s,p)=>s+p.price*cart[p.id],0)});cart={};save();panel('Pedido simulado','<p>Pedido registrado apenas neste navegador.</p><p class="notice">Nenhuma compra real foi realizada.</p>')}function sellerPanel(){if(!store)return panel('Criar loja','<p class="notice">Cadastro demonstrativo, salvo apenas neste navegador.</p><form onsubmit="createStore(event)"><label class="field">Nome da loja<input name="name" maxlength="60" required></label><label class="field">Cidade<input name="city" maxlength="60" required></label><button>Criar loja</button></form>');panel('Central do lojista','<h3>'+esc(store.name)+'</h3><p class="muted">'+esc(store.city)+'</p><button onclick="productForm()">+ Cadastrar produto</button><h3>Meus anúncios</h3>'+mine.map(p=>'<div class="row"><div>'+esc(p.name)+'<br>'+fmt(p.price)+' · Estoque '+p.stock+'</div><button onclick="remove('+p.id+')">Excluir</button></div>').join('')+'<p class="notice">Seus produtos são salvos somente neste navegador. Outros usuários não podem vê-los sem um backend.</p>')}function createStore(e){e.preventDefault();let f=new FormData(e.target);store={name:String(f.get('name')).trim(),city:String(f.get('city')).trim()};save();sellerPanel()}function productForm(){panel('Cadastrar produto','<form onsubmit="createProduct(event)"><label class="field">Nome<input name="name" maxlength="90" required></label><label class="field">Categoria<select name="cat">'+categories.slice(1).map(c=>'<option>'+c+'</option>').join('')+'</select></label><label class="field">Preço (R$)<input name="price" type="number" min="0.01" max="1000000" step="0.01" required></label><label class="field">Estoque<input name="stock" type="number" min="1" max="100000" step="1" required></label><label class="field">URL da foto (opcional)<input name="img" type="url"></label><button>Publicar anúncio</button></form>')}function createProduct(e){e.preventDefault();let f=new FormData(e.target),price=Number(f.get('price')),stock=Number(f.get('stock'));if(!(price>0&&Number.isInteger(stock)&&stock>0))return;let img=String(f.get('img')||'');if(!img.startsWith('https://'))img='https://placehold.co/300x300?text=Produto';mine.unshift({id:Date.now(),name:String(f.get('name')).trim(),cat:String(f.get('cat')),price,stock,img,store:store.name});save();render();sellerPanel()}function remove(id){if(!confirm('Excluir anúncio?'))return;mine=mine.filter(p=>p.id!==id);delete cart[id];save();render();sellerPanel()}document.getElementById('search').addEventListener('input',()=>{category='';all=true;render()});render();</script></html>
